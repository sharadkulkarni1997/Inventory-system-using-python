<!DOCTYPE html>
<html>
<head>
    <title>Consume Box</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<h2>Consume Box</h2>

<form method="POST">
    {% csrf_token %}
    <label>Scan Barcode:</label>
    <input name="barcode" class="form-control" required autofocus><br>

    <button class="btn btn-danger">Consume</button>
</form>

</body>
</html>
